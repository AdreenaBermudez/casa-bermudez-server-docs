services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.5.2.5491-ls155
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./config/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    security_opt:
      - label:disable

  radarr:
    image: lscr.io/linuxserver/radarr:6.3.0.10514-ls312
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./config/radarr:/config
      - /var/mnt/gdrive/arr-stack:/data
    ports:
      - 7878:7878
    restart: unless-stopped
    security_opt:
      - label:disable

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls320
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./config/sonarr:/config
      - /var/mnt/gdrive/arr-stack:/data
    ports:
      - 8989:8989
    restart: unless-stopped
    security_opt:
      - label:disable

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.3_v2.0.13-ls469
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - WEBUI_PORT=8081
    volumes:
      - ./config/qbittorrent:/config
      - /var/mnt/gdrive/arr-stack:/data
    ports:
      - 8081:8081
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped
    security_opt:
      - label:disable

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=America/Los_Angeles
    ports:
      - 8191:8191
    restart: unless-stopped
    security_opt:
      - label:disable
